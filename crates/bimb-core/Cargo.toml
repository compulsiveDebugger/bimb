[package]
name = "bimb-core"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
notify = "8"

[target.'cfg(windows)'.dependencies]
windows-collections = "0.3"
windows = { version = "0.62", features = [
    "Foundation", "Graphics_Imaging", "Storage", "Storage_FileProperties", "Storage_Streams",
    "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_WinRT",
    "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
