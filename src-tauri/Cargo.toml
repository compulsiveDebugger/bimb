[package]
name = "bimb"
version.workspace = true
edition.workspace = true
default-run = "bimb"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bimb-core = { path = "../crates/bimb-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
